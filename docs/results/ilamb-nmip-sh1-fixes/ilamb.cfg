table_unit = "g m-2 d-1"
plot_unit  = "g m-2 d-1"

[FLUXCOM]
source        = "/mnt/beegfs/scratch/tc229954e/ilamb_data/gpp/FLUXCOM/gpp.nc"
weight        = 15
table_unit    = "Pg yr-1"
plot_unit     = "g m-2 d-1"
space_mean    = False
skip_iav      = True
relationships = "Evapotranspiration/GLEAMv3.3a"

[WECANN]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/gpp/WECANN/gpp.nc"
weight     = 15
table_unit = "Pg yr-1"
plot_unit  = "g m-2 d-1"
space_mean = False

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Leaf Area Index]
variable       = "lai"
cmap           = "Greens"
weight         = 3
mass_weighting = True

[AVH15C1]
source        = "/mnt/beegfs/scratch/tc229954e/ilamb_data/lai/AVH15C1/lai.nc"
weight        = 15
relationships = "Precipitation/GPCPv2.3"

[MODIS]
source        = "/mnt/beegfs/scratch/tc229954e/ilamb_data/lai/MODIS/lai_0.5x0.5.nc"
weight        = 15
skip_iav      = True
relationships = "Precipitation/GPCPv2.3"
#
# #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
[h2: Global Net Ecosystem Carbon Balance]
variable = "nbp"
weight   = 5
ctype    = "ConfNBP"

[GCP]
source = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nbp/GCP/nbp_1959-2016.nc"
weight = 20

[Hoffman]
source      = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nbp/Hoffman/nbp_1850-2010.nc"
weight      = 20
skip_taylor = True
# #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# CO2 confrontation — emulates atmospheric CO2 at NOAA flask sites by
#  transporting the model's `nbp` flux. Doesn't need a model `co2`
#  variable thanks to force_emulation = True. Disabled until co2.nc
#  is downloaded; pull it via:
#    ilamb-fetch --remote_root https://www.ilamb.org/ILAMB-Data
#  or copy NOAA.GMD/co2.nc from Patrick's gws share into the local
#  /mnt/beegfs/scratch/tc229954e/ilamb_data/co2/NOAA.GMD/ directory.
#
[h2: Carbon Dioxide]
variable = "co2"
ctype    = "ConfCO2"
weight   = 5

[NOAA.Emulated]
source          = "/mnt/beegfs/scratch/tc229954e/ilamb_data/co2/NOAA.GMD/co2.nc"
emulated_flux   = "nbp"
sites           = "alt,asc,azr,bhd,bmw,brw,cba,cgo,chr,crz,gmi,hba,ice,key,kum,mhd,mid,pocs35,pocs30,pocs25,pocs20,pocs15,pocs10,pocs05,poc000,pocn05,pocn10,pocn15,pocn20,pocn25,psa,rpb,sey,shm,smo,spo,syo,zep"
lat_bands       = "-90,-60,-23,0,+23,+60,+90"
force_emulation = True


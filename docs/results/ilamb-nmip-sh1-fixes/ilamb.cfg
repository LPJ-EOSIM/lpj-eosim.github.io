weight         = 5
mass_weighting = True

[Saatchi]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/Saatchi2011/biomass_0.5x0.5.nc"
weight     = 20
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

[Thurner]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/Thurner/biomass_0.5x0.5.nc"
weight     = 20
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

[ESACCI]
source       = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/ESACCI/biomass.nc"
scale_factor = 0.6375
weight       = 20
table_unit   = "Pg"
plot_unit    = "kg m-2"
space_mean   = False
skip_rmse    = True

[XuSaatchi]
source       = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/XuSaatchi2021/XuSaatchi.nc"
scale_factor = 1.275
weight       = 20
table_unit   = "Pg"
plot_unit    = "kg m-2"

tas_source      = "/mnt/beegfs/scratch/tc229954e/ilamb_data/tas/CRU4.02/tas.nc"
pr_source       = "/mnt/beegfs/scratch/tc229954e/ilamb_data/pr/GPCCv2018/pr.nc"
npp_source      = "/mnt/beegfs/scratch/tc229954e/ilamb_data/cSoil/Koven/npp_0.5x0.5.nc"

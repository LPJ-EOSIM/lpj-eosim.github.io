weight     = 15
table_unit = "mm d-1"
plot_unit  = "mm d-1"

[MOD16A2]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/evspsbl/MOD16A2/et.nc"
weight     = 15
table_unit = "mm d-1"
plot_unit  = "mm d-1"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[h2: Burned Area]
variable   = "burntArea"
cmap       = "Reds"
weight     = 5

[GFED4.1S]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/burntArea/GFED4.1S/burntArea.nc"
weight     = 15
table_unit = "%"
plot_unit  = "%"

[h2: Runoff]
variable       = "runoff"
alternate_vars = "mrro"
cmap           = "Blues"
weight         = 5
mass_weighting = True

[Dai]
ctype  = "ConfRunoff"
source = "/mnt/beegfs/scratch/tc229954e/ilamb_data/mrro/Dai/runoff.nc"
weight = 15

[LORA]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/mrro/LORA/LORA.nc"
weight     = 15
table_unit = "mm d-1"
plot_unit  = "mm d-1"

[CLASS]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/mrro/CLASS/mrro.nc"
weight     = 25
table_unit = "mm d-1"
plot_unit  = "mm d-1"


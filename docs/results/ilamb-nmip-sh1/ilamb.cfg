#! define_regions = /mnt/beegfs/scratch/tc229954e/ilamb_data/regions/GlobalLand.nc

[h1: Ecosystem and Carbon Cycle]
bgcolor = "#ECFFE6"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Biomass]
variable       = "biomass"
alternate_vars = "vegc,cVeg"
cmap           = "Greens"
weight         = 5
mass_weighting = True

[Saatchi]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/Saatchi2011/biomass_0.5x0.5.nc"
weight     = 20
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

[Thurner]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/Thurner/biomass_0.5x0.5.nc"
weight     = 20
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

[ESACCI]
source       = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/ESACCI/biomass.nc"
scale_factor = 0.6375
weight       = 20
table_unit   = "Pg"
plot_unit    = "kg m-2"
space_mean   = False
skip_rmse    = True

[XuSaatchi]
source       = "/mnt/beegfs/scratch/tc229954e/ilamb_data/biomass/XuSaatchi2021/XuSaatchi.nc"
scale_factor = 1.275
weight       = 20
table_unit   = "Pg"
plot_unit    = "kg m-2"
space_mean   = False
skip_rmse    = True
skip_iav     = False
skip_cycle   = True
rmse_score_basis = "series"
biasscore_switch = True

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Gross Primary Productivity]
variable       = "gpp"
alternate_vars = "mgpp"
cmap           = "Greens"
weight         = 5
mass_weighting = True

[FLUXNET2015]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/gpp/FLUXNET2015/gpp.nc"
weight     = 9
table_unit = "g m-2 d-1"
plot_unit  = "g m-2 d-1"

[FLUXCOM]
source        = "/mnt/beegfs/scratch/tc229954e/ilamb_data/gpp/FLUXCOM/gpp.nc"
weight        = 15
table_unit    = "Pg yr-1"
plot_unit     = "g m-2 d-1"
space_mean    = False
skip_iav      = True
relationships = "Evapotranspiration/GLEAMv3.3a"

[WECANN]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/gpp/WECANN/gpp.nc"
weight     = 15
table_unit = "Pg yr-1"
plot_unit  = "g m-2 d-1"
space_mean = False

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Global Net Ecosystem Carbon Balance]
variable = "nbp"
weight   = 5
ctype    = "ConfNBP"

[GCP]
source = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nbp/GCP/nbp_1959-2016.nc"
weight = 20

[Hoffman]
source      = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nbp/Hoffman/nbp_1850-2010.nc"
weight      = 20
skip_taylor = True
# #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# CO2 confrontation — emulates atmospheric CO2 at NOAA flask sites by
#  transporting the model's `nbp` flux. Doesn't need a model `co2`
#  variable thanks to force_emulation = True. Disabled until co2.nc
#  is downloaded; pull it via:
#    ilamb-fetch --remote_root https://www.ilamb.org/ILAMB-Data
#  or copy NOAA.GMD/co2.nc from Patrick's gws share into the local
#  /mnt/beegfs/scratch/tc229954e/ilamb_data/co2/NOAA.GMD/ directory.
#
[h2: Ecosystem Respiration]
variable       = "reco"
cmap           = "Oranges"
derived        = "ra+rh"
weight         = 4
mass_weighting = True

[FLUXNET2015]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/reco/FLUXNET2015/reco.nc"
weight     = 6
table_unit = "g m-2 d-1"
plot_unit  = "g m-2 d-1"

[FLUXCOM]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/reco/FLUXCOM/reco.nc"
weight     = 4
table_unit = "Pg yr-1"
plot_unit  = "g m-2 d-1"
space_mean = False
skip_iav   = True

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Every run merges mnee and ILAMB-Data ships two NEE products, but the shipped
# config never declared the confrontation, so this scored nothing for anyone.
[h2: Net Ecosystem Exchange]
variable       = "nee"
cmap           = "PRGn"
weight         = 4
mass_weighting = True

[FLUXNET2015]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nee/FLUXNET2015/nee.nc"
weight     = 6
table_unit = "g m-2 d-1"
plot_unit  = "g m-2 d-1"

[Fluxnet]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/nee/Fluxnet/nee.nc"
weight     = 4
table_unit = "g m-2 d-1"
plot_unit  = "g m-2 d-1"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Soil Carbon]
variable       = "cSoilAbove1m"
alternate_vars = "soilc"
cmap           = "Greens"
weight         = 5
mass_weighting = True

[HWSD]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/cSoil/HWSD/soilc_0.5x0.5.nc"
weight     = 15
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

[NCSCDV22]
source     = "/mnt/beegfs/scratch/tc229954e/ilamb_data/cSoil/NCSCDV22/soilc_0.5x0.5.nc"
weight     = 12
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True

###########################################################################

[h1: Hydrology Cycle]
bgcolor = "#E6F9FF"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[h2: Evapotranspiration]
variable       = "et"
